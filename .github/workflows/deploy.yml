name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

env:
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/app

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # =========================
    # BUILD + PUSH DOCKER IMAGE
    # =========================
    - name: Docker login
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build and push image
      run: |
        docker build -t $IMAGE:${{ github.run_number }} .
        docker push $IMAGE:${{ github.run_number }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:

    # =========================
    # SSH TO K3S VM
    # =========================
    - name: Deploy on K3s VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.K8S_HOST }}
        username: ${{ secrets.K8S_USER }}
        key: ${{ secrets.K8S_SSH_KEY }}
        script: |

          set -e

          IMAGE="${{ secrets.DOCKER_USERNAME }}/app:${{ github.run_number }}"

          echo "Deploying $IMAGE"

          # =========================
          # OPTIONAL: GET SECRETS FROM VAULT (ON VM)
          # =========================
          export VAULT_ADDR=http://127.0.0.1:8200

          # login to vault (AppRole or token stored on VM)
          # TOKEN=$(curl ...)

          # docker login (if needed from Vault)
          # echo $PASS | docker login ...

          # =========================
          # KUBERNETES DEPLOY
          # =========================
          kubectl set image deployment/app \
            app=$IMAGE \
            -n devops-app

          kubectl rollout status deployment/app -n devops-app
